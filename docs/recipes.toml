[recipe.git-commit]
description = "Save all staged changes as a new commit, authored by DevelAngel. Each commit is a release note!"
# TODO: adapt the hardcoded --author identity below when reusing this
# recipes.toml for a different project or committer.
run = ["git", "-C", "{project}", "commit", "--author", "Angelos Drossos <develangel@mail.drossos.de>", "--message", "{type}({scope}){breaking_change_marker}: {description}\n\n{body}"]

[recipe.git-commit.args.project]
help = "project directory"
level = "info"
type = "path"

[recipe.git-commit.args.type]
help = "conventional commit type, e.g. feat,fix,refactor,chore,build,ci"
level = "info"

[recipe.git-commit.args.scope]
help = "conventional commit scope (no type, not empty)"
level = "info"

[recipe.git-commit.args.breaking_change_marker]
help = "\"!\" for a breaking change; an empty string otherwise."
level = "info"

[recipe.git-commit.args.description]
help = "commit message description (<=35 characters, use imperative mood, written release-note friendly, begin lowercase)"
level = "info"

[recipe.git-commit.args.body]
help = "commit message body (line length <=72 characters, descriptive, no files)"
level = "debug"
type = "text"

[recipe.git-commit.annotations]
title = "Git Commit"
read_only = false
destructive = false
idempotent = false
open_world = false

