# --- Rust ---

[recipe.rust-check]
description = "Check that the whole project still compiles, including tests"
run = ["change-dir", "{project}", "cargo", "check", "--quiet", "--all-targets"]

[recipe.rust-check.args.project]
help = "project directory"
level = "info"
type = "path"

[recipe.rust-check.annotations]
title = "Rust Check"
read_only = true
destructive = false
idempotent = true
open_world = false

[recipe.rust-lint]
description = "Run the linter (Clippy) and report style/correctness issues"
run = ["change-dir", "{project}", "cargo", "clippy"]

[recipe.rust-lint.args.project]
help = "project directory"
level = "info"
type = "path"

[recipe.rust-lint.annotations]
title = "Rust Lint"
read_only = true
destructive = false
idempotent = true
open_world = false

[recipe.rust-test]
description = "Run the full test suite"
run = ["change-dir", "{project}", "cargo", "nextest", "run", "--cargo-quiet"]

[recipe.rust-test.args.project]
help = "project directory"
level = "info"
type = "path"

[recipe.rust-test.annotations]
title = "Rust Test"
read_only = true
destructive = false
idempotent = true
open_world = false

