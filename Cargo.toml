[workspace]
resolver = "3"
members = ["agent/lorem-agent", "app/chat", "app/cli", "app/log-buffer", "app/mcp/confetti", "app/mcp/git-commit-fix-close", "app/mcp/git-commit-fix-open", "app/session", "app/wire", "app/workflow", "app2", "mcp/gh", "mcp/python", "mcp/rust"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
agent-client-protocol = { version = "2.0.0", features = ["unstable_mcp_over_acp", "unstable_protocol_v2"] }
agent-client-protocol-rmcp = { version = "3.0.0", features = ["unstable_mcp_over_acp"] }
ansi-to-tui = "8"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
clap-verbosity-flag = { version = "3.0.4", features = ["tracing"] }
color-eyre = "0.6.5"
derive_more = { version = "1", features = ["deref", "display"] }
kid-agentic-coding-chat = { path = "app/chat" }
log-buffer = { package = "kid-agentic-coding-log-buffer", path = "app/log-buffer" }
nerdicons_rs = "0.1"
schemars = "1"
serde = "1"
serde_json = "1"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "0.9"
rmcp = { version = "3.1.0", features = ["macros", "schemars", "server", "transport-io"] }
thiserror = "2.0"
tokio = { version = "1.52", default-features = false, features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "chrono"] }
rand = "0.10"
textwrap = "0.16"
tui-markdown = "0.3.9"
cucumber = "0.23"
wire = { package = "kid-agentic-coding-wire", path = "app/wire" }
kid-agentic-coding-session = { path = "app/session" }
kid-agentic-coding-workflow = { path = "app/workflow" }

# color-eyre: improving perf on debug builds
[profile.dev.package.backtrace]
opt-level = 3
