[workspace]
resolver = "3"
members = ["app", "lorem-agent"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
agent-client-protocol = { version = "2.0.0", features = ["unstable_mcp_over_acp", "unstable_protocol_v2"] }
clap = { version = "4.5", features = ["derive"] }
clap-verbosity-flag = { version = "3.0.4", features = ["tracing"] }
color-eyre = "0.6.5"
serde_json = "1"
ansi-to-tui = "8"
ratatui = "0.30.2"
ratatui-textarea = "0.9"
tokio = { version = "1.52", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "chrono"] }

# color-eyre: improving perf on debug builds
[profile.dev.package.backtrace]
opt-level = 3
